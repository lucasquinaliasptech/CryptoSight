<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/cadstyle.css">
    <link rel="icon" href="./assets/imgs/ChatGPT_Image_11_de_ago._de_2026__13_30_37-removebg-preview(1) 2.png">
    <title>Cadastro</title>
</head>
<body>
    <div class="quadrados">
    <div class="union">
    <img src="./assets/imgs/Union.png" alt="" class="union-normal">
    <img src="./assets/imgs/union-bright.png" alt="" class="union-bright">
    </div>
    </div>
    <main>
        <div class="esquerda">
        <div class="seta" onclick="history.back()">
            <img src="./assets/imgs/seta.png" alt="">
        </div>
        <div class="logo">
            <img src="./assets/imgs/ChatGPT_Image_11_de_ago._de_2026__13_30_37-removebg-preview(1) 2.png" alt="" class="icone">
            <div class="crypto">CryptoSight</div>
        </div>
        </div>
        <div class="direita">
            <div class="titulo">Cadastre um novo usuário</div>
            <div class="form">
                <label class="campos esq">
                    <span class="campo">Nome:</span>
                    <input type="text" id="nome_input" placeholder="Digite seu nome..">
                </label>
                <label class="campos dir">
                    <span class="campo">Email:</span>
                    <input type="email" id="email_input" placeholder="Digite seu email..">
                </label>
                <label class="campos esq">
                    <span class="campo">Senha:</span>
                    <input type="password" id="senha_input" placeholder="Digite sua senha..">
                </label>
                <label class="campos dir">
                    <span class="campo">Confirmar senha:</span>
                    <input type="password" id="confirmacao_senha_input" placeholder="Digite sua senha..">
                </label>
                <div class="conta">Já possui uma <a href="login.html">conta</a>?</div>
                <button class="submit" onclick="cadastrar()">CADASTRAR</button>
            </div>
        </div>
    </main>
</body>
</html>

<script src="animations.js"></script>

<script>
  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;  

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login(aqua).html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }


  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
