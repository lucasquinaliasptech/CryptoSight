<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AquaTech | Cadastro Empresa</title>

  <script src="./js/sessao.js"></script>

  <!-- <link rel="stylesheet" href="./css/estilo.css" /> -->
  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body onload="listar()">
  <!--header inicio-->
  <div class="header">
    <div class="container">
      <h1 class="titulo">AquaTech</h1>
      <ul class="navbar">
        <li>
          <a href="index.html">Inicial</a>
        </li>
        <li>
          <a href="simulador.html">Simulador</a>
        </li>
        <li>|</li>
        <li>
          <a href="login.html">Login</a>
        </li>
        <li class="agora">
          <a href="#">Cadastro</a>
        </li>
      </ul>
    </div>
  </div>
  <!--header fim-->

  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-cadastro">
        <h2>Bem-vindo!</h2>
        <div class="formulario">
          <!--
                         Para inserir mais um campo, copie uma das inputs abaixo.
                         Assim que inserir vá para o script abaixo.
                     -->
          <div class="campo">
            <span>Razão social:</span>
            <input id="razaoSocial_input" type="text" placeholder="Ex.: CryptoSight Tecnologia LTDA" />
          </div>
          <div class="campo">
            <span>Telefone:</span>
            <input id="telefone_input" type="text" placeholder="Digite o telefone da empresa" />
          </div>
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="Digite o E-mail da empresa" />
          </div>
          <div class="campo">
            <span>Nome fantasia:</span>
            <input id="nomeFantasia_input" type="text" placeholder="Ex.: CryptoSight" />
          </div>
          <div class="campo">
            <span>CNPJ:</span>
            <input id="cnpj_input" type="text" placeholder="Digite o CNPJ da empresa" />
          </div>
          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" />
          </div>
          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
          </div>
          <div class="campo">
            <span>Cep:</span>
            <input id="cep_input" type="text" placeholder="Digite o CEP" />
          </div>
          <div class="campo">
            <span>Estado:</span>
            <select id="uf_input">
              <option value="">Selecione</option>
            </select>
          </div>
          <div class="campo">
            <span>Cidade:</span>
            <input id="cidade_input" type="text" placeholder="Digite a Cidade" />
          </div>
          <div class="campo">
            <span>Bairro:</span>
            <input id="bairro_input" type="text" placeholder="Digite o Bairro" />
          </div>
          <div class="campo">
            <span>Logradouro:</span>
            <input id="logradouro_input" type="text" placeholder="Digite o Logradouro" />
          </div>
          <div class="campo">
            <span>Numero:</span>
            <input id="numero_input" type="text" placeholder="Digite o número" />
          </div>
          <div class="campo">
            <span>Complemento:</span>
            <input id="complemento_input" type="text" placeholder="Opcional" />
          </div>
          <div class="campo">
            <span>Sede:</span>
            <label>
              <input id="sede_sim" type="radio" name="sede" value="1">
              Sim
            </label>

            <label>
              <input id="sede_nao" type="radio" name="sede" value="0">
              Não
            </label>
          </div>
          <button class="botao" onclick="cadastrarEmpresa()">Cadastrar</button>
        </div>

        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>

  <!--footer inicio-->
  <div class="footer">
    <div class="container">
      <h4>Feito com amor por aluno &hearts; SPTech &copy; 2023</h4>
      <span class="version">v1.0.0</span>
    </div>
  </div>
  <!--footer fim-->
</body>

</html>

<script>

  function cadastrarEmpresa() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var razaoSocialVar = razaoSocial_input.value;
    var telefoneVar = telefone_input.value;
    var emailVar = email_input.value;
    var nomeFantasiaVar = nomeFantasia_input.value;
    var cnpjVar = cnpj_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    var cepVar = cep_input.value;
    var ufVar = uf_input.value;
    var cidadeVar = cidade_input.value;
    var bairroVar = bairro_input.value;
    var logradouroVar = logradouro_input.value;
    var numeroVar = numero_input.value;
    var complementoVar = complemento_input.value;
    var sedeVar;

    let indice_ponto_com = emailVar.indexOf(".com");
    let indice_arroba = emailVar.indexOf("@");
    let arroba_antes_ponto_com = indice_arroba < indice_ponto_com - 1;
    let termina_em_ponto_com = emailVar.endsWith(".com");

    if (sede_sim.checked) {
      sedeVar = 1;
    } else if (sede_nao.checked) {
      sedeVar = 0;
    }


    // Verificando se há algum campo em branco
    if (
      razaoSocialVar.trim() == "" ||
      telefoneVar.trim() == "" ||
      emailVar.trim() == "" ||
      nomeFantasiaVar.trim() == "" ||
      cnpjVar.trim() == "" ||
      senhaVar.trim() == "" ||
      confirmacaoSenhaVar.trim() == "" ||
      cepVar.trim() == "" ||
      ufVar.trim() == "" ||
      cidadeVar.trim() == "" ||
      bairroVar.trim() == "" ||
      logradouroVar.trim() == "" ||
      numeroVar.trim() == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Preencha todos s campos obrigatórios ";

      finalizarAguardar();
      return false;

    } else if (razaoSocialVar.trim().length < 5) {

      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Razão Social deve possuir no mínimo 5 caracteres";
      return false;

    } else if (telefoneVar.length != 11 || isNaN(telefoneVar)) {

      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Telefone inválido";
      return false;

    } else if (!(arroba_antes_ponto_com &&
      indice_arroba > -1 &&
      indice_ponto_com > -1 &&
      termina_em_ponto_com)) {

      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Email inválido";
      return false;

    } else if (nomeFantasiaVar.trim().length < 3) {

      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Nome Fantasia deve possuir no mínimo 3 caracteres";
      return false;

    } else if (cnpjVar.length != 14 || isNaN(cnpjVar)) {

      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "CNPJ inválido";
      return false;

    } else if (senhaVar.length < 6) {

      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Senha inválida: Mínimo 6 caracteres";
      return false;

    } else if (senhaVar != confirmacaoSenhaVar) {

      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "As senhas precisam estar iguais";
      return false;

    } else if (cepVar.length != 8 || isNaN(cepVar)) {

      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "CEP inválido";
      return false;

    } else if (!sede_sim.checked && !sede_nao.checked) {

      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Selecione se o endereço é sede ou não.";
      return false;

    }

    // Enviando o valor da nova input
    fetch("/empresas/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        razaoSocial: razaoSocialVar,
        telefone: telefoneVar,
        email: emailVar,
        nomeFantasia: nomeFantasiaVar,
        cnpj: cnpjVar,
        senha: senhaVar,

        cep: cepVar,
        uf: ufVar,
        cidade: cidadeVar,
        bairro: bairroVar,
        logradouro: logradouroVar,
        numero: numeroVar,
        complemento: complementoVar,
        sede: sedeVar

      }),
    })
      .then(function (resposta) {

        console.log("resposta: ", resposta);

        if (resposta.ok) {

          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, 2000);

          limparFormulario();
          finalizarAguardar();

        } else {

          return resposta.json().then(function (dados) {

            cardErro.style.display = "block";
            mensagem_erro.innerHTML = dados.mensagem;

          });

        }

      })
      .catch(function (erro) {

        console.log(`#ERRO: ${erro}`);
        finalizarAguardar();

      });

    return false;
  }

  function listar() {
    fetch("/ufs/listarEstados", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((ufs) => {
          ufs.forEach((uf) => {

            uf_input.innerHTML += ` <option value="${uf.id}">${uf.nome} - ${uf.sigla}</option>`;

          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
